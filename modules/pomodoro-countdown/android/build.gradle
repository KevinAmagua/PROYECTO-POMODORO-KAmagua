plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pomodorocountdown'
version = '1.0.0'

android {
  namespace "expo.modules.pomodorocountdown"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core:1.17.0'
}
